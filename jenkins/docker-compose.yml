version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root  # allows plugin installation and Docker inside Jenkins
    ports:
      - "8080:8080"
      - "50000:50000"  # agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # allow Docker commands
      - ./jenkins_plugins.txt:/usr/share/jenkins/ref/plugins.txt  # install plugins
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"  # skip setup wizard

volumes:
  jenkins_home:
